{%- comment -%}
  论文项目页的机器可读层：Google Scholar 靠 citation_* 索引，
  搜索引擎和 LLM 靠 JSON-LD 读结构化信息。
{%- endcomment -%}
{% if page.paper %}
{% assign p = page.paper %}
<meta name="citation_title" content="{{ page.title | escape }}">
{% for a in p.authors %}<meta name="citation_author" content="{{ a | escape }}">
{% endfor %}<meta name="citation_publication_date" content="{{ p.year }}">
<meta name="citation_journal_title" content="{{ p.venue_meta | default: p.venue | escape }}">
{% if p.arxiv %}<meta name="citation_arxiv_id" content="{{ p.arxiv }}">
<meta name="citation_pdf_url" content="https://arxiv.org/pdf/{{ p.arxiv }}">
{% endif %}{% if p.doi %}<meta name="citation_doi" content="{{ p.doi }}">
{% endif %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ScholarlyArticle",
  "headline": {{ page.title | jsonify }},
  "name": {{ page.title | jsonify }},
  "abstract": {{ p.tldr | jsonify }},
  "author": [{% for a in p.authors %}{"@type": "Person", "name": {{ a | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],
  "datePublished": {{ p.date | jsonify }},
  "url": "{{ page.url | absolute_url }}",
  "publisher": {"@type": "Organization", "name": {{ p.venue_meta | default: p.venue | jsonify }}}{% if p.doi %},
  "identifier": "https://doi.org/{{ p.doi }}"{% endif %}{% if p.figures %},
  "image": [{% for f in p.figures %}{{ f.src | absolute_url | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]{% endif %}
}
</script>
{% if p.faq.size > 0 %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [{% for f in p.faq %}{
    "@type": "Question",
    "name": {{ f.q | jsonify }},
    "acceptedAnswer": {"@type": "Answer", "text": {{ f.a | jsonify }}}
  }{% unless forloop.last %},{% endunless %}{% endfor %}]
}
</script>
{% endif %}
{% endif %}
